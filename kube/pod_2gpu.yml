apiVersion: v1
kind: Pod
metadata:
  name: maja-pod-billy-2gpu
spec:
  containers:
  - name: mypod
    image: gitlab-registry.nrp-nautilus.io/jmduarte/hhh:latest 
    command: ["/bin/bash", "-c", "sleep infinity"]
    resources:
      limits:
        cpu: "8"
        memory: 32Gi
        nvidia.com/gpu: 2
      requests:
        memory: 32Gi
        cpu: "8"
        nvidia.com/gpu: 2
    volumeMounts:
    - mountPath: /maad-vol
      name: maad-vol
    - mountPath: /home/jovyan/.ssh  # Changed from /root/.ssh
      name: git-ssh
      readOnly: true
  restartPolicy: Never
  volumes:
    - name: maad-vol
      persistentVolumeClaim:
        claimName: maad-vol
    - name: git-ssh
      secret:
        secretName: git-ssh
        defaultMode: 0400
  # ... rest of your config
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values:
              - gpn-fiona-mizzou-2.rnet.missouri.edu
              - gpengine-uams.areon.net
              - rci-nrp-gpu-05.sdsu.edu
              - node-2-2.sdsc.optiputer.net
              - hcc-gpengine-shor-c5303.unl.edu
              - node-1-3.sdsc.optiputer.net
              - k8s-a100-01.suncorridor.org
              - k8s-haosu-23.sdsc.optiputer.net
              - k8s-gpu-01.calit2.optiputer.net
              - hcc-chase-shor-c4705.unl.edu
