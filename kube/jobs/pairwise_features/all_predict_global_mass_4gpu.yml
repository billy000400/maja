apiVersion: batch/v1
kind: Job
metadata:
  labels:
    jobgroup: hhh-job-train
  name: hhh-pairwise-predict-global-mass
spec:
  backoffLimit: 0
  parallelism: 1
  template:
    spec:
      initContainers:
      - name: init-clone-repo
        image: alpine/git
        command:
        - "/bin/sh"
        - "-c"
        - >
          git clone --single-branch --branch master --recurse-submodules https://github.com/Alexanders101/SPANet /opt/repo/hhh &&
          chown -R 1000:1000 /opt/repo/hhh
        volumeMounts:
        - name: git-repo
          mountPath: /opt/repo
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: '1'
            memory: 1Gi
      containers:
      - name: training
        image: gitlab-registry.nrp-nautilus.io/jmduarte/hhh:latest
        command:
        - "/bin/bash"
        - "-c"
        - >
          cd /maad-vol/SPANet &&
          pip install -e . &&
          python -m spanet.train \
              -of /maad-vol/option_files/pairwise_feature/assign_resolved_hhh_predict_global_mass_w_pairwise_features_4gpu.json \
              -l /maad-vol/logs \
              -n pairwise_AND_predict_global_mass \
              --gpus 4 \
              --epochs 500 \
              --batch_size 4096
        resources:
          limits:
            memory: 32Gi
            cpu: "16"
            nvidia.com/gpu: "4"
          requests:
            memory: 32Gi
            cpu: "16"
            nvidia.com/gpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - mountPath: /maad-vol
          name: maad-vol
        - name: git-repo
          mountPath: /opt/repo
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: maad-vol
        persistentVolumeClaim:
          claimName: maad-vol
      - name: git-repo
        emptyDir: {}
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - ry-gpu-10.sdsc.optiputer.net

        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-GeForce-RTX-4090
