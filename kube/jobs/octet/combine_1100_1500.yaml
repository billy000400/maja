apiVersion: batch/v1
kind: Job
metadata:
  labels:
    jobgroup: octet-job-train
  name: octet-job-train-1100-1500-pairwise-billy
spec:
  backoffLimit: 0
  parallelism: 1
  template:
    spec:
      initContainers:
      - name: init-clone-repo
        image: alpine/git
        command:
        - "/bin/sh"
        - "-c"
        - >
          git clone --single-branch --branch master --recurse-submodules https://github.com/Alexanders101/SPANet /opt/repo/octet &&
          chown -R 1000:1000 /opt/repo/octet
        volumeMounts:
        - name: git-repo
          mountPath: /opt/repo
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: '1'
            memory: 1Gi
      containers:
      - name: training
        image: gitlab-registry.nrp-nautilus.io/jmduarte/hhh:latest
        command:
        - "/bin/bash"
        - "-c"
        - >
          cd /maad-vol/SPANet &&
          pip install -e . &&
          python -m spanet.train -of /maad-vol/option_files/octet/1100_1500_pairwise.json -l /maad-vol/logs -n octet_1100_1500_pairwise --epochs 500 --gpus 4 --batch_size 2048
        resources:
          limits:
            memory: 32Gi
            cpu: "16"
            nvidia.com/gpu: "4"
          requests:
            memory: 32Gi
            cpu: "16"
            nvidia.com/gpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - mountPath: /maad-vol
          name: maad-vol
        - name: git-repo
          mountPath: /opt/repo
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: maad-vol
        persistentVolumeClaim:
          claimName: maad-vol
      - name: git-repo
        emptyDir: {}
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - none
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-TITAN-RTX
                - NVIDIA-RTX-A5000
                - Quadro-RTX-6000
                - Tesla-V100-SXM2-32GB
      tolerations:
        - key: "nautilus.io/reservation"
          operator: "Equal"
          value: "spanet"
          effect: "NoSchedule"
