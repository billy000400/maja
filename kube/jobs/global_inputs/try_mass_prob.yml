apiVersion: batch/v1
kind: Job
metadata:
  labels:
    jobgroup: hhh-job-train
  name: hhh-job-mass-prob-input
spec:
  backoffLimit: 0
  parallelism: 1
  template:
    spec:
      initContainers:
      - name: init-clone-repo
        image: alpine/git
        command:
        - "/bin/sh"
        - "-c"
        - >
          git clone --single-branch --branch master --recurse-submodules https://github.com/Alexanders101/SPANet /opt/repo/hhh &&
          chown -R 1000:1000 /opt/repo/hhh
        volumeMounts:
        - name: git-repo
          mountPath: /opt/repo
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: '1'
            memory: 1Gi
      containers:
      - name: training
        image: gitlab-registry.nrp-nautilus.io/jmduarte/hhh:latest
        command:
        - "/bin/bash"
        - "-c"
        - |
          set -e -o pipefail
          cd /maad-vol/SPANet &&
          pip install -e . &&
          OPTION_FILE=/maad-vol/option_files/global_input/mass_prob_4gpu.json &&
          LOG_DIR=/maad-vol/logs &&
          TRAINING_NAME=global_mass_prob_input &&
          EPOCHS=500 &&
          BATCH_SIZE=4096 &&
          RUN_LOG="$LOG_DIR/${TRAINING_NAME}_run.log" &&
          ERROR_LOG="$LOG_DIR/${TRAINING_NAME}_error.log" &&
          python -m spanet.train -of $OPTION_FILE -l $LOG_DIR -n $TRAINING_NAME --epochs $EPOCHS --gpus 4 --batch_size $BATCH_SIZE 2>&1 | tee "$RUN_LOG" || {
            EXIT=$?
            {
              echo "=== spanet.train FAILED at $(date) ==="
              echo "Exit code: $EXIT"
              echo "=== Last 500 lines of output ==="
              tail -500 "$RUN_LOG"
            } > "$ERROR_LOG"
            echo "Error saved to $ERROR_LOG"
            exit $EXIT
          }
        resources:
          limits:
            memory: 32Gi
            cpu: "16"
            nvidia.com/gpu: "4"
          requests:
            memory: 32Gi
            cpu: "16"
            nvidia.com/gpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - mountPath: /maad-vol
          name: maad-vol
        - name: git-repo
          mountPath: /opt/repo
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: maad-vol
        persistentVolumeClaim:
          claimName: maad-vol
      - name: git-repo
        emptyDir: {}
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - none
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                # - NVIDIA-GeForce-GTX-1080
                # - NVIDIA-GeForce-GTX-1080-Ti
                # - NVIDIA-GeForce-GTX-2080-Ti
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-GeForce-RTX-4090
